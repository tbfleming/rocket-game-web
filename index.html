      // Whether the player has gone somewhere else: the tab hidden, or another
      // window or app in front. Kept as data-away on <html>, which the game
      // reads to pause itself (see page.rs) and the sound below follows.
      //
      // Tracked from blur and focus events, not document.hasFocus(): some
      // Android browsers (DuckDuckGo's) say the page never has the focus, even
      // while the player is tapping it, which froze the game on its title
      // card. A touch, click or key always means the player is here.
      (function () {
        let blurred = false;
        const update = () => {
          const away = document.visibilityState !== 'visible' || blurred;
          document.documentElement.toggleAttribute('data-away', away);
        };
        const here = () => { blurred = false; update(); };
        window.addEventListener('blur', () => { blurred = true; update(); });
        window.addEventListener('focus', here);
        for (const type of ['pointerdown', 'touchstart', 'keydown']) {
          document.addEventListener(type, here, { capture: true });
        }
        document.addEventListener('visibilitychange', update);
        window.addEventListener('pagehide', update);
        window.addEventListener('pageshow', update);
        window.gameAway = () => document.documentElement.hasAttribute('data-away');
      })();
    </script>

      // the game loads, so remember every context and resume them on the first

      // game's script, which is why it sits above the Trunk link.
      //
      // iPhones need more:
      // - After a phone call, Siri, locking the screen or switching apps, iOS
      //   leaves a context "interrupted" (not "suspended"), so any state but
      //   running gets resumed, on every touch, not just the first.
      // - Safari only lets a finger start audio on touchend, pointerup or
      //   click (pointerdown counts only for a mouse).
      // - The ring/silent switch mutes web audio, unless the page says it
      //   plays media: navigator.audioSession on iOS 17 and up, and before
      //   that, a silent looping <audio> element.
      //

      // app, the window in the background); the game pauses itself too.

        if (window.webkitAudioContext) window.webkitAudioContext = Tracked;
        window.__gameAudioContexts = contexts; // for tests

        if (navigator.audioSession) {
          try { navigator.audioSession.type = 'playback'; } catch (e) {}
        } else if (/iPhone|iPad|iPod/.test(navigator.userAgent) ||
                   (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {

          const n = 800;
          const wav = new DataView(new ArrayBuffer(44 + n));
          const text = (at, s) => { for (let i = 0; i < s.length; i++) wav.setUint8(at + i, s.charCodeAt(i)); };

          wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
          wav.setUint32(24, 8000, true); wav.setUint32(28, 8000, true);
          wav.setUint16(32, 1, true); wav.setUint16(34, 8, true);
          text(36, 'data'); wav.setUint32(40, n, true);
          for (let i = 0; i < n; i++) wav.setUint8(44 + i, 128);
          keepAlive = new Audio(URL.createObjectURL(new Blob([wav], { type: 'audio/wav' })));
          keepAlive.loop = true;
        }

        const resume = () => {
          for (const ctx of contexts) {
            if (ctx.state !== 'running' && ctx.state !== 'closed') {
              ctx.resume().catch(() => {});
            }
          }
          if (keepAlive && keepAlive.paused) keepAlive.play().catch(() => {});
        };
        for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
          document.addEventListener(type, resume, { capture: true });
        }
        const pause = () => {
          for (const ctx of contexts) {
            if (ctx.state === 'running') ctx.suspend().catch(() => {});
          }
          if (keepAlive && !keepAlive.paused) keepAlive.pause();
        };
        // Coming back: start again straight away (iOS may still want a tap).
        const check = () => {
          if (window.gameAway()) pause();
          else resume();
        };
        document.addEventListener('visibilitychange', check);
        window.addEventListener('blur', pause);
        window.addEventListener('focus', check);
        window.addEventListener('pagehide', pause);
        window.addEventListener('pageshow', check);
      })();

    <script>
      // The leader counts down 3, 2, 1 and around again, its hand sweeping
      // once a second, until the game is running. The game fades the
      // loading screen out itself, once it has drawn (see page.rs).
      (function () {
        const sweep = document.getElementById('sweep');
        const count = document.getElementById('count');
        const loading = document.getElementById('loading');
        const start = performance.now();
        const tick = (now) => {
          if (loading.classList.contains('done')) return;
          const t = (now - start) / 1000;
          sweep.style.setProperty('--turn', ((t % 1) * 360).toFixed(1) + 'deg');
          count.textContent = 3 - (Math.floor(t) % 3);
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      })();
    </script>
